[package]
name = "lipi"
version = "1.0.3"
edition = "2021"
description = "Type Singlish in any app and get Sinhala (Unicode or FM Abhaya)."
repository = "https://github.com/sanjaya3d/LIPI"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
# None. LIPI uses only what Windows already has.

[profile.release]
opt-level = "s"
lto = true
strip = true
