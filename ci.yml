name: CI

# Checks every change. The tests run on Linux (they do not need Windows),
# and the program itself is built on Windows. The BUILD badge in the README
# shows the result of this workflow.
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Run the tests
        run: cargo test

  windows-build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the program
        run: cargo build --release
